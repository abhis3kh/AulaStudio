[package]
name = "aula-studio"
version = "0.1.0"
edition = "2024"
default-run = "aula-studio"
rust-version = "1.95"
license = "MIT"
description = "Native Windows USB configuration and music lighting for the AULA F75 keyboard"
readme = "README.md"
publish = false
include = ["src/**", "assets/keyboard-layout.json", "Cargo.toml", "Cargo.lock", "LICENSE", "README.md"]

[lib]
path = "src/lib.rs"

[dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "glow", "accesskit"] }
hidapi = { version = "2.6.7", default-features = false, features = ["windows-native"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Media_Audio", "Win32_Media_KernelStreaming", "Win32_Media_Multimedia", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant"] }

[features]
capture = ["eframe/__screenshot"]
wireless-diagnostics = []

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true
