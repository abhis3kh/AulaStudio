name: Windows checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install the verified Rust toolchain
        run: |
          rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Formatting
        run: .\BUILD.ps1 fmt
      - name: Clippy
        run: .\BUILD.ps1 clippy
      - name: Tests without hardware
        run: .\BUILD.ps1 test
      - name: Verify bundled dependency notices
        run: |
          python tools/generate-notices.py --verify-bundle
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build and package default-feature release
        run: .\BUILD.ps1 package
      - name: Retain portable application and checksums
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: AulaStudio-windows-x86_64
          path: |
            dist/releases/*.zip
            dist/releases/*.sha256
          if-no-files-found: error
          retention-days: 14

  minimum-rust:
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Verify the declared Rust 1.95 minimum
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo +1.95.0 check --locked --all-targets
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
