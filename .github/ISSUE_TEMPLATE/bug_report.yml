name: Bug report
description: Report a reproducible problem with Aula Studio.
body:
  - type: markdown
    attributes:
      value: "Do not attach personal profiles, macros, recovery checkpoints or credentials. Use SECURITY.md for security vulnerabilities."
  - type: input
    id: version
    attributes:
      label: App version or commit
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Windows version and keyboard variant
      description: Include USB identifiers if known. Do not include a device serial number.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Describe the exact actions and whether you were using wired USB.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Expected and actual result
      description: Include the error message without personal paths or macro contents.
    validations:
      required: true
